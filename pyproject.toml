[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-qa"
version = "0.1.0"
description = "Evidence-first pre-release quality scanner for web applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Maria Mustafa" }]
dependencies = [
  "Jinja2>=3.1,<4",
  "playwright>=1.49,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
preflight-qa = "preflight_qa.cli:main"

[tool.setuptools.packages.find]
include = ["preflight_qa*"]

[tool.setuptools.package-data]
preflight_qa = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
