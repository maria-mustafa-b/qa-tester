target: http://127.0.0.1:8080
max_pages: 20
timeout_ms: 10000
headless: true
ignore_https_errors: false
allowed_hosts:
  - 127.0.0.1
blocked_url_patterns:
  - /logout
  - /delete
  - /remove
  - /purchase
accessibility_tags:
  - wcag2a
  - wcag2aa
  - wcag21aa
  - wcag22aa
performance_budgets:
  ttfb_ms: 800
  fcp_ms: 1800
  lcp_ms: 2500
  cls: 0.1
  transfer_kb: 3000
  request_count: 100
viewports:
  - name: desktop
    width: 1440
    height: 900
  - name: mobile
    width: 390
    height: 844
fail_on: high
